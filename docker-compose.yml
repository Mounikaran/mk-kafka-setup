services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2182:2181"
    restart: always
    
    networks:
      - kafka-network
  
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    restart: always
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Message size configurations (2GB limit)
      KAFKA_MESSAGE_MAX_BYTES: 2147483647
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2147483647
      KAFKA_LOG_SEGMENT_BYTES: 2147483647
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 2147483647
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 104857600
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 104857600

    networks:
      - kafka-network
      - core-backend-service_default
      - smart-service_app_net
      # - ticketing-backend-service_default
      - kafka-invite-service_default
      - analytics-dashboard-backend-service_default

networks:
  kafka-network:
    driver: bridge
  core-backend-service_default:
    external: true
  kafka-invite-service_default:
    external: true
  # ticketing-backend-service_default:
  #   external: true
  analytics-dashboard-backend-service_default:
    external: true
  smart-service_app_net:
    external: true

# use kafka:9093 in other networks to access this kafka
